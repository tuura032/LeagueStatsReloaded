name: update-standings

on:
  schedule:
    - cron: '0 13 * * *'    # daily ~8am ET
  workflow_dispatch:         # manual "run now"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Q3: the scoring math is the only real logic in the repo, and the
      # bot commits its output straight to production. Fail before fetching
      # rather than publishing standings computed by broken code.
      - name: Run tests
        run: python -m unittest test_compute -v

      - name: Fetch, compute, build
        # LEAGUE_PHRASE is a repository secret. build.py hashes it and bakes
        # only the SHA-256 into the pages, so the phrase itself is never
        # committed. If the secret is unset the gate is simply omitted.
        env:
          LEAGUE_PHRASE: ${{ secrets.LEAGUE_PHRASE }}
        run: |
          python fetch.py
          python compute.py
          python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes - skipping commit."
          else
            git commit -m "Update standings (auto)"
            git push
          fi
